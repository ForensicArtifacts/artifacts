# Run tests on Mac OS.
name: test_macos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test_macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - os: macos-26
          python-version: '3.14'
          toxenv: 'py314'
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install dependencies
      run: |
        brew update -q
        brew install -q gettext gnu-sed python@${{ matrix.python-version }} tox || true
        brew link --force gettext
    - name: Run tests
      run: |
        tox -e ${{ matrix.toxenv }}
