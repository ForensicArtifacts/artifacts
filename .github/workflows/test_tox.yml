# Run tox tests on Ubuntu Docker images using GIFT PPA
name: test_tox
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - python-version: '3.10'
          toxenv: 'py310,wheel'
        - python-version: '3.11'
          toxenv: 'py311,wheel'
        - python-version: '3.12'
          toxenv: 'py312,wheel'
        - python-version: '3.13'
          toxenv: 'py313,wheel'
        - python-version: '3.14'
          toxenv: 'py314,wheel'
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install tox
    - name: Run tests
      env:
        LANG: en_US.UTF-8
      run: |
        tox -e${{ matrix.toxenv }}
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - python-version: '3.12'
          toxenv: 'coverage'
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install tox
    - name: Run tests with coverage
      env:
        LANG: en_US.UTF-8
      run: |
        tox -e${{ matrix.toxenv }}
    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - python-version: '3.12'
          toxenv: 'lint'
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install tox
    - name: Run linter
      env:
        LANG: en_US.UTF-8
      run: |
        tox -e${{ matrix.toxenv }}
